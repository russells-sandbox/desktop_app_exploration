[package]
name = "rust-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
